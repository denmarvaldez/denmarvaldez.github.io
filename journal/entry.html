<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Note | Denmar Valdez</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Learning Journal Entry by Denmar Valdez.">
  <meta name="author" content="Denmar Valdez">

  <!-- Bootstrap 5.3 Framework -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- FontAwesome Retro Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- KaTeX CSS for LaTeX Math Formatting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="../styles.css">
</head>

<body>

  <!-- Retro CRT Scanline Overlay -->
  <div class="scanlines"></div>

  <!-- Header Navigation -->
  <header class="header">
    <div class="container header-container">
      <a href="../index.html#hero" class="logo" id="nav-logo">
        <span class="logo-pixel-blink"></span> DENMAR.VALDEZ
      </a>

      <nav class="nav-menu" id="nav-menu">
        <a href="../index.html#hero" class="nav-link">MAIN</a>
        <a href="../index.html#projects" class="nav-link">WORKS</a>
        <a href="../index.html#blogs" class="nav-link">BLOGS</a>
        <a href="../index.html#sanctum" class="nav-link">SANCTUM</a>
        <a href="../index.html#contact" class="nav-link">CONTACT</a>
        <a href="../journal.html" class="nav-link active">JOURNAL</a>
        <a href="../index.html#contact" class="btn-pixel-primary d-lg-none mt-2" style="font-size: 0.85rem;">
          <i class="fa-solid fa-terminal"></i> CONTACT
        </a>
      </nav>

      <div class="header-actions">
        <a href="https://drive.google.com/file/d/1zkQVpFr8ml7LrfEZCIOmK-PqjIBGD9Fh/view?usp=sharing" target="_blank"
          rel="noopener noreferrer" class="btn-pixel-outline header-resume-btn">
          <i class="fa-solid fa-file-pdf"></i> RESUME
        </a>
        <a href="../index.html#contact" class="btn-pixel-primary d-none d-lg-inline-flex">
          <i class="fa-solid fa-terminal"></i> CONTACT
        </a>
        <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Article Section -->
  <main class="page-content-offset">
    <div class="container">
      <!-- Breadcrumb Link -->
      <div class="mb-4">
        <a href="../journal.html" class="btn-pixel-outline" style="font-size: 0.82rem; padding: 6px 14px;">
          <i class="fa-solid fa-arrow-left"></i> BACK TO LEARNING JOURNAL
        </a>
      </div>

      <!-- Entry Article Wrapper -->
      <article class="journal-article-wrapper position-relative">
        <div id="entry-header-container">
          <!-- Dynamically populated by entry.js -->
        </div>

        <div id="entry-body-container" class="journal-modal-body py-4">
          <div class="text-center py-5">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-cyan);"></i>
            <p class="mt-3" style="font-family: var(--font-mono); color: var(--text-muted);">LOADING JOURNAL NOTE...</p>
          </div>
        </div>

        <div id="entry-tags-container" class="mt-4 pt-3" style="border-top: 2px solid var(--border-pixel-muted); display: flex; gap: 8px; flex-wrap: wrap;">
          <!-- Dynamically populated tags -->
        </div>

        <!-- Next / Previous Entry Navigation -->
        <div class="journal-nav-bar mt-5 pt-4" id="entry-footer-nav" style="border-top: 2px dashed var(--border-pixel-muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
          <!-- Dynamically populated prev/next links -->
        </div>
      </article>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer py-4" style="background: var(--bg-secondary); border-top: 2px solid var(--border-pixel-muted);">
    <div class="container text-center">
      <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); margin: 0;">
        &copy; 2026 DENMAR VALDEZ. PUSHING PIXEL BOULDERS & LEARNING ML.
      </p>
    </div>
  </footer>

  <!-- External Libraries & Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- KaTeX for LaTeX equations -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <script src="entry.js"></script>
</body>

</html>
